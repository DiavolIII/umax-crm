<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юмакс CRM - курсы</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-header">
        <div class="app-logo">
            <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
                <rect width="48" height="48" rx="12" fill="url(#grad)"/>
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#FF6B00"/></linearGradient></defs>
                <path d="M24 14L34 20V28L24 34L14 28V20L24 14Z" stroke="white" stroke-width="2" fill="none"/>
                <circle cx="24" cy="24" r="3" fill="white"/>
            </svg>
            <h1>Юмакс <span>CRM</span></h1>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <span class="user-role" id="userRole"></span>
            <button class="logout-btn" onclick="logout()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </div>
    <nav class="app-nav">
        <a href="requests.html" class="nav-link">заявки</a>
        <a href="courses.html" class="nav-link active">курсы</a>
        <a href="users.html" class="nav-link" id="usersNav" style="display:none">пользователи</a>
        <a href="import.html" class="nav-link" id="importNav" style="display:none">импорт</a>
    </nav>
    <div class="main-content">
        <div class="welcome-card">
            <div><h2>каталог курсов</h2><p>управление программами подготовки</p></div>
            <button class="btn-create" id="createCourseBtn" style="background:white; color:#FF6B00" onclick="openCourseModal()">+ новый курс</button>
        </div>
        <div id="coursesGrid" class="courses-grid"></div>
    </div>

    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="courseModalTitle">новый курс</h3><button class="close-modal" onclick="closeCourseModal()">&times;</button></div>
            <div class="modal-body">
                <input type="hidden" id="courseEditId">
                <div class="form-group"><label>название курса</label><input type="text" id="courseName" required></div>
                <div class="form-row"><div class="form-group"><label>предмет</label><input type="text" id="courseSubject" required></div><div class="form-group"><label>тип экзамена</label><select id="courseExamType"><option value="ОГЭ">ОГЭ</option><option value="ЕГЭ">ЕГЭ</option></select></div></div>
                <div class="form-row"><div class="form-group"><label>класс</label><input type="number" id="courseGrade" min="9" max="11"></div><div class="form-group"><label>формат</label><select id="courseFormat"><option>Онлайн</option><option>Очно</option><option>Смешанный</option></select></div></div>
                <div class="form-row"><div class="form-group"><label>стоимость (₽)</label><input type="number" id="coursePrice" min="0"></div><div class="form-group"><label>свободных мест</label><input type="number" id="courseFreeSeats" min="0"></div></div>
                <div class="form-group"><label>дата старта</label><input type="date" id="courseStartDate"></div>
            </div>
            <div class="modal-footer"><button class="btn-cancel" onclick="closeCourseModal()">отмена</button><button class="btn-save" onclick="saveCourse()">сохранить</button></div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/courses.js"></script>
</body>
</html>
