<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юмакс CRM — импорт данных</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="app-logo">
            <svg width="40" height="40" viewBox="0 0 48 48" fill="none">
                <rect width="48" height="48" rx="12" fill="url(#grad)"/>
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#FF8C00"/><stop offset="100%" stop-color="#FF6B00"/></linearGradient></defs>
                <path d="M24 14L34 20V28L24 34L14 28V20L24 14Z" stroke="white" stroke-width="2" fill="none"/>
                <circle cx="24" cy="24" r="3" fill="white"/>
            </svg>
            <h1>Юмакс <span>CRM</span></h1>
        </div>
        <div class="user-info">
            <span class="user-name" id="userName"></span>
            <span class="user-role" id="userRole"></span>
            <button class="logout-btn" onclick="logout()" title="выйти">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </button>
        </div>
    </header>

    <nav class="app-nav">
        <a href="requests.html" class="nav-link">заявки</a>
        <a href="courses.html" class="nav-link">курсы</a>
        <a href="users.html" class="nav-link" id="usersNav">пользователи</a>
        <a href="import.html" class="nav-link active" id="importNav">импорт</a>
    </nav>

    <main class="main-content">
        <div class="welcome-card">
            <div><h2>импорт данных</h2><p>загрузка заявок из Excel или CSV</p></div>
        </div>

        <div class="import-card">
            <h3 class="section-title">загрузить файл</h3>
            <p class="import-desc">Поддерживаются форматы <strong>.xlsx</strong>, <strong>.xls</strong>, <strong>.csv</strong>. Файл должен содержать колонки: StudentFullName, Grade, Phone, CourseName, Source, Status.</p>

            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden>
                <div class="upload-icon">📂</div>
                <p>перетащите файл сюда или <button class="link-btn" onclick="document.getElementById('fileInput').click()">выберите</button></p>
                <p class="upload-filename" id="fileName"></p>
            </div>

            <div class="import-actions">
                <button class="btn-save" id="importBtn" onclick="uploadFile()" disabled>импортировать</button>
                <button class="btn-reset" onclick="downloadTemplate()">⬇ скачать шаблон CSV</button>
            </div>

            <div id="importResult" class="import-result" style="display:none"></div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/import.js"></script>
</body>
</html>
